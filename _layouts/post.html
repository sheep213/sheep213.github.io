---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y年%m月%d日' }}</time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>

<p class="back"><a href="{{ '/writing/' | relative_url }}">← 返回文章列表</a></p>
